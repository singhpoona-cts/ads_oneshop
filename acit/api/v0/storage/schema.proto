// NOTE: As of the Merchant API migration (Phase 2), the product messages below
// model the **native Merchant API v1 `Product`** shape (snake_case attributes
// nested under `product_attributes`, `Price` in micros, enums stored as their
// NAME string, `gtins` repeated, `custom_label_0..4`). The Content API
// `productstatuses` collection no longer exists -- status is carried in
// `Product.product_status` by the API and split into `WideProduct.status` by the
// Beam pipeline. `WideProduct.product.channel` is a DERIVED dimension
// (`legacy_local ? "local" : "online"`) needed for the Ads performance FK join,
// which still keys on channel.

syntax = "proto3";

package acit.api.v0.storage;

import "bq_table.proto";

message WideProduct {
  option (gen_bq_schema.bigquery_opts).table_name = "Products";
  optional Product product = 1;
  optional ProductStatus status = 2;
  optional bool has_performance_max_targeting = 3;
  repeated int64 performance_max_campaign_ids = 4;
  optional bool has_shopping_targeting = 5;
  repeated int64 shopping_campaign_ids = 6;
  optional bool in_stock = 7;
  repeated string approved_countries = 8;
  repeated string pending_countries = 9;
  repeated string disapproved_countries = 10;
  optional string offer_id = 11;
  optional string account_id = 12;
}

// Phase 3 migration: Content API `liasettings` -> Merchant API v1
// `OmnichannelSettings`. v1 has no `liasettings` resource, no MCA roll-down
// `list`, and the aggregator itself is not a valid parent (PermissionDenied), so
// settings are listed per (sub)account directly. We therefore drop the old
// {settings, children[]} envelope and write one FLAT row per account, each with a
// repeated list of per-region OmnichannelSetting. The MCA<->child relationship is
// recovered downstream from the (already migrated) `accounts` table.
message OmnichannelLiaSettings {
  option (gen_bq_schema.bigquery_opts).table_name = "liasettings";

  optional int64 account_id = 1;

  repeated OmnichannelSetting omnichannel_settings = 2;
}

// === Merchant API v1 Product ===

message Product {
  // Resource name: accounts/{account}/products/{product}.
  optional string name = 1;

  // Identity (top-level on the v1 Product, was encoded into the old colon `id`).
  optional string offer_id = 2;

  optional string content_language = 3;

  optional string feed_label = 4;

  // Native v1 flag indicating a local (vs online) offer.
  optional bool legacy_local = 5;

  // DERIVED from `legacy_local` in the Beam pipeline ("local"/"online"). Kept so
  // the Ads `performance` FK join (which keys on `productChannel`) and the
  // listing-group targeting matcher keep working. Not a raw API field.
  optional string channel = 6;

  optional string data_source = 7;

  optional int64 version_number = 8;

  optional ProductAttributes product_attributes = 9;

  repeated CustomAttribute custom_attributes = 10;
}

message ProductAttributes {
  optional string title = 1;

  optional string description = 2;

  optional string link = 3;

  optional string mobile_link = 4;

  optional string canonical_link = 5;

  optional string image_link = 6;

  repeated string additional_image_links = 7;

  repeated string lifestyle_image_links = 8;

  optional bool identifier_exists = 9;

  optional bool is_bundle = 10;

  optional string brand = 11;

  // Was the single `gtin` string in the Content API; now repeated.
  repeated string gtins = 12;

  optional string mpn = 13;

  optional string google_product_category = 14;

  repeated string product_types = 15;

  optional string item_group_id = 16;

  optional string color = 17;

  optional string material = 18;

  optional string pattern = 19;

  optional string size = 20;

  // Enum NAME strings.
  optional string size_system = 21;

  repeated string size_types = 22;

  optional string age_group = 23;

  optional string gender = 24;

  optional bool adult = 25;

  // Enum NAME strings (e.g. IN_STOCK / NEW / PAUSED).
  optional string availability = 26;

  optional string condition = 27;

  optional string pause = 28;

  optional string expiration_date = 29;

  optional string disclosure_date = 30;

  optional string availability_date = 31;

  // Pricing. `Price` is now {amount_micros, currency_code}.
  optional Price price = 40;

  optional Price sale_price = 41;

  optional string sale_price_effective_date = 42;

  optional Price cost_of_goods_sold = 43;

  optional Price auto_pricing_min_price = 44;

  optional Price maximum_retail_price = 45;

  // Shipping.
  repeated Shipping shipping = 50;

  optional ShippingWeight shipping_weight = 51;

  optional int64 max_handling_time = 52;

  optional int64 min_handling_time = 53;

  optional string shipping_label = 54;

  optional string transit_time_label = 55;

  repeated FreeShippingThreshold free_shipping_threshold = 56;

  // Dimensions / weight.
  optional ProductDimension product_height = 60;

  optional ProductDimension product_length = 61;

  optional ProductDimension product_width = 62;

  optional ProductWeight product_weight = 63;

  // Custom labels (underscore before the digit in v1).
  optional string custom_label_0 = 70;

  optional string custom_label_1 = 71;

  optional string custom_label_2 = 72;

  optional string custom_label_3 = 73;

  optional string custom_label_4 = 74;

  // Destinations.
  repeated string included_destinations = 80;

  repeated string excluded_destinations = 81;

  repeated string shopping_ads_excluded_countries = 82;

  // Misc.
  repeated string promotion_ids = 90;

  optional int64 multipack = 91;

  optional string external_seller_id = 92;

  repeated ProductDetail product_details = 93;

  repeated string product_highlights = 94;

  optional int64 sell_on_google_quantity = 95;

  optional string energy_efficiency_class = 96;

  optional string min_energy_efficiency_class = 97;

  optional string max_energy_efficiency_class = 98;
}

message Price {
  optional int64 amount_micros = 1;

  optional string currency_code = 2;
}

message ProductDimension {
  optional double value = 1;

  optional string unit = 2;
}

message ProductWeight {
  optional double value = 1;

  optional string unit = 2;
}

message ShippingWeight {
  optional double value = 1;

  optional string unit = 2;
}

message Shipping {
  optional Price price = 1;

  optional string country = 2;

  optional string region = 3;

  optional string service = 4;

  optional int64 location_id = 5;

  optional string location_group_name = 6;

  optional string postal_code = 7;

  optional int64 min_handling_time = 8;

  optional int64 max_handling_time = 9;

  optional int64 min_transit_time = 10;

  optional int64 max_transit_time = 11;
}

message FreeShippingThreshold {
  optional string country = 1;

  optional Price price_threshold = 2;
}

message CustomAttribute {
  optional string name = 1;

  optional string value = 2;

  repeated CustomAttribute group_values = 3;
}

message ProductDetail {
  optional string section_name = 1;

  optional string attribute_name = 2;

  optional string attribute_value = 3;
}

// === Merchant API v1 ProductStatus (was the Content API `productstatuses`) ===

message ProductStatus {
  repeated DestinationStatus destination_statuses = 1;

  repeated ItemLevelIssue item_level_issues = 2;

  optional string creation_date = 3;

  optional string last_update_date = 4;

  optional string google_expiration_date = 5;
}

message DestinationStatus {
  // Enum NAME string. Was `destination` ("Shopping"/"SurfacesAcrossGoogle"/...);
  // now SHOPPING_ADS / FREE_LISTINGS / DEMAND_GEN_ADS / VIDEO_ADS / ...
  optional string reporting_context = 1;

  repeated string approved_countries = 2;

  repeated string pending_countries = 3;

  repeated string disapproved_countries = 4;
}

message ItemLevelIssue {
  optional string code = 1;

  // Was `servability`. Enum NAME string (e.g. DISAPPROVED / DEMOTED / ...).
  optional string severity = 2;

  optional string resolution = 3;

  // Was `attribute_name`.
  optional string attribute = 4;

  // Was `destination`. Enum NAME string.
  optional string reporting_context = 5;

  optional string description = 6;

  optional string detail = 7;

  optional string documentation = 8;

  repeated string applicable_countries = 9;
}

// Native Merchant API v1 omnichannel (Local Inventory Ads) setting -- one per
// region, replacing the old LiaCountrySettings. Enums are stored as their NAME
// strings (e.g. "ACTIVE", "LSF_TYPE_UNSPECIFIED", "GHLSF").
message OmnichannelSetting {
  optional string name = 1;

  optional string region_code = 2;

  // LSF_TYPE_UNSPECIFIED | GHLSF | MHLSF_BASIC | MHLSF_FULL. Folds the old
  // `hostedLocalStorefrontActive` (-> GHLSF) and `omnichannelExperience.lsfType`
  // (-> MHLSF_BASIC / MHLSF_FULL) into a single enum.
  optional string lsf_type = 3;

  // Local product inventory feed (was `inventory.status`).
  optional OmnichannelFeatureState in_stock = 4;

  // In-store pickup (was `storePickupActive` / `omnichannelExperience.pickupType`).
  optional OmnichannelFeatureState pickup = 5;

  // POS / Local Feeds Partnership link (was `posDataProvider`).
  optional LfpLink lfp_link = 6;

  // On-display-to-order (was `onDisplayToOrder`).
  optional OmnichannelFeatureState odo = 7;

  // Merchant "about" page (was `about`).
  optional OmnichannelFeatureState about = 8;

  // Inventory-verification workflow + contact (was the
  // `inventoryVerificationContact*` fields under `inventory`).
  optional InventoryVerification inventory_verification = 9;
}

// Shared {uri, state} shape for in_stock / pickup / odo / about. `state` is an
// enum NAME string: STATE_UNSPECIFIED | ACTIVE | FAILED | RUNNING | ACTION_REQUIRED.
message OmnichannelFeatureState {
  optional string uri = 1;

  optional string state = 2;
}

message LfpLink {
  optional string lfp_provider = 1;

  optional string external_account_id = 2;

  optional string state = 3;
}

message InventoryVerification {
  // STATE_UNSPECIFIED | ACTION_REQUIRED | INACTIVE | RUNNING | SUCCEEDED | SUSPENDED.
  optional string state = 1;

  optional string contact = 2;

  optional string contact_email = 3;

  // STATE_UNSPECIFIED | ACTIVE | FAILED | RUNNING | ACTION_REQUIRED.
  optional string contact_state = 4;
}
